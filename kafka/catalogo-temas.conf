# RedVital — catálogo de temas (DD V3.0, Tabla 27). Única fuente de verdad del
# trabajo de inicialización: un tema que no está aquí no existe, porque el
# broker no crea temas automáticamente.
#
# Convención: redvital.<contexto>.<evento>.v<mayor>. Un consumidor añade su
# grupo: <tema>.<grupo>.retry-<n> (un tema por nivel de espera) y
# <tema>.<grupo>.dlt (mensajes muertos), DD 14.1.
#   - Donación (Spring) reintenta sin detener la partición: retry-0, -1 y -2,
#     con esperas de 2, 10 y 50 s, y luego .dlt.
#   - Campañas (.NET) reintenta en el propio consumidor unos segundos y luego
#     va a .dlt: el cliente .NET no tiene temas de reintento (entrada 83).
#   - Notificaciones (Spring) reintenta los rechazos por retry-0 a -5, con
#     esperas de 15 s a 5 min y ocho intentos en total (DD, Tabla 17).
#   - Institucional (.NET) reintenta como Campañas: unos segundos y luego .dlt.
#
# Limpieza: delete (por defecto) o compact. EV-07 lleva el estado completo de
# cada institución con su id como clave: compactado y sin vencimiento, un
# consumidor nuevo lee desde el principio y queda con todas las instituciones.
#
# tema                                                    particiones  retención_ms  limpieza
redvital.donacion.donation-completed.v1                   3            604800000
redvital.donacion.notice-requested.v1                     3            604800000
redvital.donacion.notice-requested.v1.notificaciones.retry-0 3         604800000
redvital.donacion.notice-requested.v1.notificaciones.retry-1 3         604800000
redvital.donacion.notice-requested.v1.notificaciones.retry-2 3         604800000
redvital.donacion.notice-requested.v1.notificaciones.retry-3 3         604800000
redvital.donacion.notice-requested.v1.notificaciones.retry-4 3         604800000
redvital.donacion.notice-requested.v1.notificaciones.retry-5 3         604800000
redvital.campanias.campaign-published.v1                  3            604800000
redvital.campanias.campaign-published.v1.donacion.retry-0 3            604800000
redvital.campanias.campaign-published.v1.donacion.retry-1 3            604800000
redvital.campanias.campaign-published.v1.donacion.retry-2 3            604800000
redvital.donacion.donation-completed.v1.campanias.dlt     1            1209600000
redvital.campanias.campaign-published.v1.donacion.dlt     1            1209600000
redvital.donacion.notice-requested.v1.notificaciones.dlt  1            1209600000
# EV-07, productor Institucional; lo consumen Campañas y Donación.
redvital.institucional.institution-changed.v1             3            -1            compact
redvital.institucional.institution-changed.v1.donacion.retry-0 3       604800000
redvital.institucional.institution-changed.v1.donacion.retry-1 3       604800000
redvital.institucional.institution-changed.v1.donacion.retry-2 3       604800000
redvital.institucional.institution-changed.v1.donacion.dlt 1           1209600000
redvital.institucional.institution-changed.v1.campanias.dlt 1          1209600000
# EV-09, productor Donación; lo consume Institucional (M7).
redvital.donacion.indicators-updated.v1                   3            604800000
redvital.donacion.indicators-updated.v1.institucional.dlt 1            1209600000
# EV-10, un tema por productor; los consume Institucional (bitácora ST2).
redvital.identidad.audit-recorded.v1                      3            604800000
redvital.campanias.audit-recorded.v1                      3            604800000
redvital.donacion.audit-recorded.v1                       3            604800000
redvital.identidad.audit-recorded.v1.institucional.dlt    1            1209600000
redvital.campanias.audit-recorded.v1.institucional.dlt    1            1209600000
